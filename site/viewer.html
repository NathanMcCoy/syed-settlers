<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island Viewer · Syed Settlers</title>
  <link rel="stylesheet" href="/css/app.css">
  <!-- The bug button (only in browsers that opened the site with ?bugs=on): a picture and a note,
       saved to admin.pacificfish.ca's Bug reports. Same file as the admin site's bugreport.js. -->
  <script src="/js/bugreport.js" data-app="settlers" data-endpoint="https://admin.pacificfish.ca/api/bugs"></script>
  <script type="module" src="/js/viewer.js"></script>
</head>
<body>
  <header>
    <h1>Syed Settlers</h1>
    <p class="sub">Island viewer: try seeds and settings to get a feel for the board. <a href="/">Play a game</a></p>
  </header>
  <main>
    <form id="controls" autocomplete="off">
      <label>Seed <input id="seed" name="seed" spellcheck="false"></label>
      <button type="button" id="random">New island</button>
      <div id="settings"></div>
      <button type="button" id="reset">Default settings</button>
    </form>
    <p id="status" role="status"></p>
    <div id="board"></div>
    <ul id="legend"></ul>
  </main>
</body>
</html>
